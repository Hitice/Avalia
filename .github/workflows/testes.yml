# Barreira antes do merge.
#
# Existe porque rodar a suite dependia de alguem lembrar, e a leva de mudancas
# mais cara deste projeto foi escrita num ambiente sem PHP: cinco testes
# quebrados chegaram ao repositorio, entre eles um 500 no cadastro de empresa.
#
# A suite roda em SQLite em memoria, como em desenvolvimento. Nao toca o banco
# real, e por isso pode rodar em qualquer proposta de mudanca sem risco.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, intl, fileinfo
          coverage: none

      - name: Dependencias do PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Dependencias do front
        run: npm ci

      - name: Build
        run: npm run build

      # Formatacao antes dos testes: erro de estilo e barato de ver e nao
      # merece esperar a suite inteira para aparecer.
      - name: Formatacao
        run: vendor/bin/pint --test

      - name: Suite
        run: vendor/bin/pest

  # Publica so o que passou pela suite, e so a partir da main.
  #
  # A barreira e o motivo de existir: este codigo emite fatura e calcula
  # comissao, e a leva de mudancas mais cara do projeto foi escrita num ambiente
  # sem PHP, com cinco testes quebrados chegando ao repositorio. Publicar
  # depende de passar, e nao de alguem lembrar de rodar.
  publicar:
    needs: suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Tudo que exige ferramenta e montado aqui, e nao no servidor.
      #
      # A hospedagem compartilhada desabilita proc_open, exec e shell_exec, entao
      # o Composer nao roda la de jeito nenhum; e Node so existe nos planos
      # Business para cima. Aqui os dois existem sempre, e o servidor recebe o
      # resultado pronto. Isso tambem deixa o servidor com menos ferramenta
      # instalada, que e menos superficie para alguem usar.
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, fileinfo, bcmath
          coverage: none

      - name: Dependencias de producao
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Front
        run: npm ci && npm run build

      - name: Chave de acesso
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_CHAVE }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # A identidade do servidor vem de um segredo, e nao de ssh-keyscan.
          # Aceitar a chave que aparecer na hora significa aceitar tambem a de
          # quem estiver no meio do caminho, e a sessao seguinte carrega a chave
          # privada que publica em producao.
          echo "${{ secrets.SSH_IDENTIDADE }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Antes do deploy.sh, e nao depois: ele confere o ambiente e sobe a
      # aplicacao, entao precisa encontrar vendor e front no lugar.
      #
      # `--delete` remove no servidor o que saiu daqui. Sem isso, pacote retirado
      # do composer.json continuaria la para sempre, e o autoload novo apontando
      # para arquivo velho e o tipo de erro que so aparece em uma tela.
      - name: Enviar dependencias e front
        run: |
          destino="${{ secrets.SSH_USUARIO }}@${{ secrets.SSH_SERVIDOR }}:${{ secrets.SSH_CAMINHO }}"
          transporte="ssh -p ${{ secrets.SSH_PORTA || 22 }}"

          rsync -az --delete -e "$transporte" vendor/       "$destino/vendor/"
          rsync -az --delete -e "$transporte" public/build/ "$destino/public/build/"

      - name: Publicar
        run: |
          ssh -p "${{ secrets.SSH_PORTA || 22 }}" \
              "${{ secrets.SSH_USUARIO }}@${{ secrets.SSH_SERVIDOR }}" \
              'cd ${{ secrets.SSH_CAMINHO }} && ./deploy.sh'
